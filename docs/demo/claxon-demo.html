<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<title>Claxon demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Demo navegable de Claxon: avisos de los servicios que pasan por los pueblos y encargos.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap">
<style>
/* ============================================================================= ICONOS */
.i { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.i.s { width: 18px; height: 18px; }
.i.xs { width: 15px; height: 15px; }
.i.l { width: 30px; height: 30px; }
.i.xl { width: 44px; height: 44px; stroke-width: 1.8; }

/* ============================================================================= APP: COMPONENTES */
.tarjeta { background: var(--a-tarjeta); border: 1px solid var(--a-linea); border-radius: 18px; padding: 16px; display: grid; gap: 12px; }
.tarjeta.sin-pad { padding: 0; gap: 0; }
.tarjeta.crema { background: var(--a-crema); border-color: transparent; }
.tarjeta.suave { background: var(--a-suave); border-color: transparent; }
.tarjeta.oscura { background: var(--a-tinta); color: #fff; border-color: transparent; }
.tarjeta.acento { background: var(--a-acento); color: #fff; border-color: transparent; }

.circulo { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: var(--a-suave); color: var(--a-acento); flex: none; }
.circulo.azul { background: var(--a-azul-suave); color: var(--a-azul); }
.circulo.verde { background: var(--a-verde-suave); color: var(--a-verde); }
.circulo.gris { background: var(--a-crema); color: var(--a-tenue); }
.circulo.g { width: 64px; height: 64px; }
.circulo.ok { background: var(--a-ok-suave); color: var(--a-ok); }

.fila { display: flex; align-items: center; gap: 12px; min-width: 0; }
.fila > .flex { flex: 1; min-width: 0; }
.fila .t1 { font-weight: 650; font-size: 18px; line-height: 1.25; }
.fila .t2 { color: var(--a-tenue); font-size: 14.5px; line-height: 1.35; }
.lista > .fila { padding: 12px 16px; }
.lista > .fila + .fila { border-top: 1px solid var(--a-linea); }
.separa { height: 1px; background: var(--a-linea); }

.pill { display: inline-flex; align-items: center; gap: 5px; font: 600 13px/1 var(--f-texto); padding: 6px 10px; border-radius: 999px; white-space: nowrap; background: var(--a-crema); color: var(--a-tenue); }
.pill.camino { background: var(--a-suave); color: var(--a-acento-osc); }
.pill.cambio { background: var(--a-tinta); color: #fff; }
.pill.ok { background: var(--a-ok-suave); color: var(--a-ok); }
.pill.pend { background: var(--a-aviso-suave); color: var(--a-aviso); }
.pill.error { background: var(--a-error-suave); color: var(--a-error); }
.pill.azul { background: var(--a-azul-suave); color: var(--a-azul); }
.pill .punto { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

.boton { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 58px; border-radius: 16px; border: 0; background: var(--a-acento); color: #fff; font: 650 18px/1.2 var(--f-texto); padding: 0 18px; text-decoration: none; }
.boton.sec { background: var(--a-tarjeta); color: var(--a-tinta); border: 1.5px solid var(--a-linea); }
.boton.osc { background: var(--a-tinta); }
.boton.ok { background: var(--a-ok); }
.boton.mini { min-height: 44px; font-size: 15.5px; border-radius: 12px; width: auto; padding: 0 16px; }
.boton.gigante { min-height: 92px; font-size: 22px; border-radius: 22px; }
.enlace { color: var(--a-acento); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; background: none; border: 0; font-size: 16px; padding: 0; }

.campo { display: grid; gap: 6px; }
.campo label, .campo .lbl { font: 600 15px/1.2 var(--f-texto); }
.campo .entrada { min-height: 56px; border-radius: 14px; border: 1.5px solid var(--a-linea); background: var(--a-tarjeta); display: flex; align-items: center; gap: 10px; padding: 0 14px; font-size: 18px; color: var(--a-tinta); }
.campo .entrada.foco { border-color: var(--a-acento); box-shadow: 0 0 0 3px var(--a-suave); }
.campo .entrada .ph { color: #9A9EA8; }
.campo .ayuda { font-size: 13.5px; color: var(--a-tenue); }
textarea.entrada { padding: 12px 14px; font: 16px/1.4 var(--f-texto); resize: none; width: 100%; }

.contador { display: flex; align-items: center; gap: 4px; border: 1.5px solid var(--a-linea); border-radius: 14px; background: var(--a-tarjeta); flex: none; }
.contador button { width: 44px; height: 44px; border: 0; background: none; display: grid; place-items: center; color: var(--a-tinta); }
.contador b { min-width: 22px; text-align: center; font: 700 18px/1 var(--f-texto); font-variant-numeric: tabular-nums; }
.contador.activo { border-color: var(--a-acento); background: var(--a-suave); }

.interruptor { width: 56px; height: 32px; border-radius: 16px; background: #CFC8BE; position: relative; flex: none; }
.interruptor::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
.interruptor.on { background: var(--a-ok); }
.interruptor.on::after { left: 27px; }

.segmentos { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--a-crema); border-radius: 14px; padding: 4px; gap: 4px; }
.segmentos span { text-align: center; padding: 10px 6px; border-radius: 10px; font: 600 15px/1.2 var(--f-texto); color: var(--a-tenue); }
.segmentos span.on { background: var(--a-tarjeta); color: var(--a-tinta); box-shadow: 0 1px 3px rgba(0,0,0,.08); }

.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { font: 600 14.5px/1 var(--f-texto); padding: 10px 14px; border-radius: 999px; border: 1.5px solid var(--a-linea); background: var(--a-tarjeta); color: var(--a-tinta); display: inline-flex; gap: 6px; align-items: center; }
.chip.on { background: var(--a-tinta); color: #fff; border-color: var(--a-tinta); }

/* Línea de tiempo vertical de paradas / estados */
.tiempo { list-style: none; margin: 0; padding: 0; display: grid; }
.tiempo li { display: grid; grid-template-columns: 58px 28px 1fr; gap: 8px; min-height: 54px; align-items: start; }
.tiempo .h { font: 600 16px/1.2 var(--f-texto); font-variant-numeric: tabular-nums; padding-top: 3px; text-align: right; }
.tiempo .h small { display: block; font-weight: 500; font-size: 12.5px; color: var(--a-tenue); }
.tiempo .eje { position: relative; display: grid; justify-items: center; height: 100%; }
.tiempo .eje::before { content: ""; position: absolute; top: 0; bottom: 0; width: 3px; background: var(--a-linea); }
.tiempo li:first-child .eje::before { top: 12px; }
.tiempo li:last-child .eje::before { bottom: calc(100% - 12px); }
.tiempo .eje.hecho::before { background: var(--a-acento); }
.tiempo .eje i { position: relative; width: 20px; height: 20px; border-radius: 50%; border: 3px solid var(--a-acento); background: var(--a-tarjeta); margin-top: 2px; }
.tiempo .eje.hecho i { background: var(--a-acento); }
.tiempo .eje.actual i { width: 26px; height: 26px; margin-top: -1px; border-width: 4px; box-shadow: 0 0 0 6px var(--a-suave); }
.tiempo .eje.pendiente i { border-color: #C9C0B4; }
.tiempo .d { padding-bottom: 14px; display: grid; gap: 2px; }
.tiempo .d b { font-size: 17px; font-weight: 650; }
.tiempo .d span { font-size: 14px; color: var(--a-tenue); }

/* Barra de progreso horizontal de una ruta */
.progreso { display: grid; gap: 8px; }
.progreso .barra { height: 8px; border-radius: 4px; background: var(--a-linea); overflow: hidden; }
.progreso .barra i { display: block; height: 100%; background: var(--a-acento); border-radius: 4px; }

/* Notificación push */
.push { color: var(--a-tinta); background: rgba(255,255,255,.92); border-radius: 22px; padding: 12px 14px; display: grid; grid-template-columns: 40px 1fr auto; gap: 10px; align-items: start; box-shadow: 0 10px 30px -10px rgba(0,0,0,.3); }
.push .logo { width: 40px; height: 40px; border-radius: 11px; background: var(--a-acento); color: #fff; display: grid; place-items: center; }
.push .app { font: 600 12px/1.2 var(--f-texto); color: var(--a-tenue); text-transform: uppercase; letter-spacing: .06em; }
.push b { display: block; font-size: 16px; line-height: 1.25; margin-top: 2px; }
.push p { font-size: 14.5px; color: #3A404C; line-height: 1.3; }
.push time { font-size: 12.5px; color: var(--a-tenue); }
.push.en-app { position: absolute; top: 54px; left: 12px; right: 12px; z-index: 5; background: var(--a-crema); border: 1px solid var(--a-linea); }

/* Hoja inferior */
.velo { position: absolute; inset: 0; background: rgba(20, 22, 28, .45); z-index: 4; }
.hoja { position: absolute; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--a-fondo); border-radius: 28px 28px 0 0; padding: 10px 20px 32px; display: grid; gap: 16px; }
.hoja .asa { width: 44px; height: 5px; border-radius: 3px; background: #CFC8BE; justify-self: center; }

/* Código de 6 casillas */
.codigo { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.codigo span { height: 62px; border-radius: 14px; border: 1.5px solid var(--a-linea); background: var(--a-tarjeta); display: grid; place-items: center; font: 700 26px/1 var(--f-mono); }
.codigo span.foco { border-color: var(--a-acento); box-shadow: 0 0 0 3px var(--a-suave); }

/* Avatares */
.avatar { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font: 700 16px/1 var(--f-texto); color: #fff; background: var(--a-acento); flex: none; }
.avatar.azul { background: var(--a-azul); }
.avatar.verde { background: var(--a-verde); }
.avatar.osc { background: var(--a-tinta); }
.avatar.ocre { background: #8C6A3F; }
.avatar.g { width: 56px; height: 56px; font-size: 20px; }

/* Rejilla de productos */
.producto { display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
.producto + .producto { border-top: 1px solid var(--a-linea); }
.producto .flex { flex: 1; min-width: 0; }
.producto .t1 { font-weight: 650; font-size: 17px; }
.producto .t2 { font-size: 14px; color: var(--a-tenue); }

/* Mensaje vacío / éxito */
.exito { display: grid; justify-items: center; text-align: center; gap: 14px; }

/* Calendario semanal */
.semana { display: grid; grid-template-columns: 70px repeat(7, 1fr); border: 1px solid var(--a-linea); border-radius: 14px; overflow: hidden; background: var(--a-tarjeta); }
.semana > div { border-left: 1px solid var(--a-linea); border-top: 1px solid var(--a-linea); min-height: 56px; padding: 6px; font-size: 13px; position: relative; }
.semana > div:nth-child(8n+1) { border-left: 0; color: var(--a-tenue); font: 500 12px/1 var(--f-mono); padding-top: 8px; }
.semana > .cabd { border-top: 0; min-height: 0; padding: 10px 8px; font: 600 13px/1.2 var(--f-texto); background: var(--a-crema); }
.semana > .cabd.hoy { background: var(--a-tinta); color: #fff; }
.semana .bloque-c { position: absolute; z-index: 2; left: 3px; right: 3px; border-radius: 8px; padding: 5px 6px; font-size: 11.5px; line-height: 1.25; overflow: hidden; background: var(--a-azul-suave); color: #1F4E73; border-left: 0; }
.semana .bloque-c b { display: block; font-size: 12px; }
.semana .bloque-c.enf { background: var(--a-verde-suave); color: #2F5A25; }
.semana .bloque-c.cambio { background: var(--a-tinta); color: #fff; }
/* ============================================================================= TABLÓN */
.tablon { width: 1280px; height: 721px; background: var(--a-fondo); color: var(--a-tinta); border-radius: 6px; overflow: hidden; display: grid; grid-template-rows: auto 1fr auto; font-family: var(--f-texto); }
.tablon .cabt { display: flex; justify-content: space-between; align-items: end; padding: 34px 48px 22px; background: var(--a-acento); color: #fff; }
.tablon .cabt h1 { margin: 0; font: 700 64px/1 var(--f-display); }
.tablon .cabt .reloj { text-align: right; }
.tablon .cabt .reloj b { display: block; font: 700 64px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.tablon .cabt .reloj span, .tablon .cabt .sub { font: 500 17px/1.3 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; opacity: .9; }
.tablon .cuerpot { display: grid; grid-template-columns: 1.25fr 1fr; gap: 28px; padding: 28px 48px; min-height: 0; }
.tablon .pie-t { display: flex; justify-content: space-between; padding: 14px 48px 18px; font: 500 15px/1.2 var(--f-mono); letter-spacing: .08em; color: var(--a-tenue); border-top: 1px solid var(--a-linea); }
.servicio-tv { display: grid; grid-template-columns: 76px 1fr auto; gap: 20px; align-items: center; padding: 18px 0; border-bottom: 2px solid var(--a-linea); }
.servicio-tv .circulo { width: 76px; height: 76px; }
.servicio-tv .circulo .i { width: 40px; height: 40px; }
.servicio-tv b { font: 700 40px/1.05 var(--f-display); display: block; }
.servicio-tv span { font-size: 21px; color: var(--a-tenue); }
.servicio-tv .hora { font: 700 58px/1 var(--f-display); font-variant-numeric: tabular-nums; text-align: right; }
.servicio-tv .hora small { display: block; font: 600 18px/1.2 var(--f-texto); color: var(--a-acento); margin-top: 6px; }
.aviso-tv { border-radius: 20px; padding: 22px 24px; display: grid; gap: 6px; }
.aviso-tv .eti { font-size: 15px; }
.aviso-tv b { font: 700 30px/1.15 var(--f-display); }
.aviso-tv p { font-size: 20px; line-height: 1.35; }

/* =============================================================================
   Claxon · demo navegable
   Diseño: el móvil (o el panel web) en el centro de una mesa de trabajo, con
   la guía de la demo al lado. La app usa la paleta fija de Claxon; la mesa
   sigue el tema claro u oscuro del navegador.
   ============================================================================= */
:root {
  /* Mesa (sigue el tema) */
  --mesa: #EFE8DE;
  --mesa-tinta: #1E2532;
  --mesa-tenue: #5E6472;
  --mesa-linea: #DCD1C2;
  --mesa-acento: #B8492B;
  --mesa-tarjeta: #F8F3EC;

  /* App (fija) */
  --a-fondo: #FAF6F0;
  --a-tarjeta: #FFFFFF;
  --a-tinta: #1E2532;
  --a-tenue: #5B6170;
  --a-linea: #E8DFD3;
  --a-acento: #B8492B;
  --a-acento-osc: #963A21;
  --a-suave: #F4E3DA;
  --a-crema: #F2EBE1;
  --a-ok: #2F7D4F;
  --a-ok-suave: #E1F0E6;
  --a-aviso: #9A5B00;
  --a-aviso-suave: #FBEBD0;
  --a-error: #B3261E;
  --a-error-suave: #F9E1DE;
  --a-azul: #2F6F9F;
  --a-azul-suave: #E1ECF5;
  --a-verde: #4E8A3E;
  --a-verde-suave: #E5F0DF;
  --a-marco: #1B1E25;

  --f-display: "Fraunces", "Iowan Old Style", Georgia, serif;
  --f-texto: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --mesa: #15171C; --mesa-tinta: #EFEAE2; --mesa-tenue: #A4A7B0; --mesa-linea: #2C3039; --mesa-acento: #E9805F; --mesa-tarjeta: #1D2027; color-scheme: dark; }
}
:root[data-theme="dark"] { --mesa: #15171C; --mesa-tinta: #EFEAE2; --mesa-tenue: #A4A7B0; --mesa-linea: #2C3039; --mesa-acento: #E9805F; --mesa-tarjeta: #1D2027; color-scheme: dark; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--mesa); color: var(--mesa-tinta); font: 15px/1.5 var(--f-texto);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--a-azul); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ============================================================================= MESA */
.demo { display: flex; gap: 40px; justify-content: center; align-items: flex-start; max-width: 1500px; margin: 0 auto; min-height: 100%; }
.demo.web { display: block; max-width: none; }
.guia { width: 340px; flex: none; display: grid; gap: 18px; align-content: start; padding-top: 8px; }
.guia h1 { margin: 0; font: 700 34px/1.05 var(--f-display); letter-spacing: -.01em; }
.guia h1 em { font-style: italic; font-weight: 500; color: var(--mesa-acento); }
.guia p { margin: 0; color: var(--mesa-tenue); }
.guia h2, .guia-compacta h2 { margin: 0; font: 500 11.5px/1.2 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--mesa-acento); }
.guia section { display: grid; gap: 10px; }
.guia .clave { display: flex; align-items: center; gap: 10px; background: var(--mesa-tarjeta); border: 1px solid var(--mesa-linea); border-radius: 12px; padding: 10px 12px; }
.guia .clave code { font: 600 16px/1 var(--f-mono); flex: 1; }
.boton-mesa { border: 1px solid var(--mesa-linea); background: var(--mesa-tarjeta); color: var(--mesa-tinta); border-radius: 10px; padding: 7px 11px; font-size: 13.5px; font-weight: 600; display: inline-flex; gap: 6px; align-items: center; }
.boton-mesa:hover { border-color: var(--mesa-acento); }
.boton-mesa.peligro { color: #C2412B; }
.usuarios-demo { list-style: none; margin: 0; padding: 0; display: grid; border: 1px solid var(--mesa-linea); border-radius: 14px; overflow: hidden; background: var(--mesa-tarjeta); }
.usuarios-demo li { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 9px 12px; align-items: center; }
.usuarios-demo li + li { border-top: 1px solid var(--mesa-linea); }
.usuarios-demo b { font-size: 14px; }
.usuarios-demo span { font-size: 12.5px; color: var(--mesa-tenue); grid-column: 1; }
.usuarios-demo code { font: 500 12.5px/1.3 var(--f-mono); grid-column: 1; word-break: break-all; }
.usuarios-demo button { grid-column: 2; grid-row: 1 / span 3; }
.pasos { margin: 0; padding-left: 20px; display: grid; gap: 6px; color: var(--mesa-tenue); font-size: 14px; }
.pasos b { color: var(--mesa-tinta); }
.reloj-demo { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.reloj-demo b { font: 700 26px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.confirma { display: grid; gap: 8px; border: 1px solid var(--mesa-linea); border-radius: 12px; padding: 12px; background: var(--mesa-tarjeta); }
.confirma div { display: flex; gap: 8px; flex-wrap: wrap; }

.escenario { flex: none; display: grid; justify-items: center; gap: 12px; }
.demo.web .escenario { display: block; justify-items: normal; }

@media (max-width: 1100px) { .guia { display: none; } }

/* ============================================================================= MÓVIL */
.movil {
  width: 410px; height: min(864px, calc(100dvh - 48px)); min-height: 640px; flex: none; border-radius: 54px; padding: 10px; background: var(--a-marco);
  box-shadow: 0 30px 60px -30px rgba(30, 20, 10, .45), 0 0 0 1px rgba(0,0,0,.25);
}
.pantalla-app {
  width: 100%; height: 100%; border-radius: 44px; position: relative;
  background: var(--a-fondo); color: var(--a-tinta); font: 17px/1.45 var(--f-texto);
  display: flex; flex-direction: column; overflow: clip;
}
/* En el móvil de verdad la app ocupa toda la pantalla */
@media (max-width: 560px) {
  body { padding: 0; }
  .demo { display: block; height: 100%; }
  .escenario { display: block; height: 100%; }
  .movil { width: 100%; height: 100%; min-height: 0; border-radius: 0; padding: 0; box-shadow: none; background: var(--a-fondo); }
  .pantalla-app { border-radius: 0; }
  .pantalla-app > .estado { display: none; }
  .pantalla-app .cab { padding-top: max(14px, env(safe-area-inset-top, 0px)); }
  .pantalla-app .nav { padding-bottom: max(12px, env(safe-area-inset-bottom, 0px)); }
  .pantalla-app .pie-acciones { padding-bottom: max(16px, env(safe-area-inset-bottom, 0px)); }
  .escenario > .pie-escenario { display: none; }
}
.pie-escenario { font-size: 13px; color: var(--mesa-tenue); display: flex; gap: 8px; align-items: center; }

/* ============================================================================= ESTRUCTURA APP */
.estado { height: 50px; flex: none; display: flex; justify-content: space-between; align-items: center; padding: 6px 30px 0 34px; font: 600 15px/1 var(--f-texto); }
.estado .isla { width: 120px; height: 34px; border-radius: 20px; background: #000; }
.estado .der { display: flex; gap: 6px; align-items: center; font-size: 13px; }
.estado .der .i { width: 17px; height: 17px; }
.cab { flex: none; display: flex; align-items: center; gap: 10px; padding: 8px 20px 12px; min-height: 60px; }
.cab h1 { margin: 0; font: 700 26px/1.15 var(--f-display); flex: 1; min-width: 0; }
.cab .volver { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--a-linea); background: var(--a-tarjeta); display: grid; place-items: center; color: var(--a-tinta); flex: none; padding: 0; }
.cuerpo { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 4px 20px 20px; display: flex; flex-direction: column; gap: 16px; scrollbar-width: thin; }
.cuerpo > * { flex: none; }
.cuerpo.centrado { justify-content: center; }
.pie-acciones { flex: none; padding: 12px 20px 22px; display: grid; gap: 10px; background: var(--a-fondo); border-top: 1px solid var(--a-linea); }
.nav { flex: none; display: grid; grid-template-columns: repeat(4, 1fr); padding: 8px 8px 18px; background: var(--a-tarjeta); border-top: 1px solid var(--a-linea); }
.nav button { display: grid; justify-items: center; gap: 3px; font: 500 12.5px/1.2 var(--f-texto); color: var(--a-tenue); padding: 6px 0; position: relative; background: none; border: 0; }
.nav button.activo { color: var(--a-tinta); font-weight: 700; }
.nav button.activo .i { color: var(--a-acento); }
.nav .globo { position: absolute; top: 2px; left: calc(50% + 6px); min-width: 18px; height: 18px; border-radius: 9px; background: var(--a-acento); color: #fff; font: 700 11px/18px var(--f-texto); text-align: center; padding: 0 5px; }

/* Texto */
.eti { font: 500 12px/1.2 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--a-tenue); }
.eti.acento { color: var(--a-acento); }
.titulo-g { font: 700 30px/1.1 var(--f-display); margin: 0; letter-spacing: -.005em; text-wrap: balance; }
.titulo-m { font: 700 22px/1.2 var(--f-display); margin: 0; }
.texto-t { color: var(--a-tenue); margin: 0; }
.peq { font-size: 14.5px; }
.mono { font-family: var(--f-mono); }
.num { font-variant-numeric: tabular-nums; }
b.num, span.num { white-space: nowrap; }
p { margin: 0; }
h2, h3 { margin: 0; }

/* ============================================================================= INTERACCIÓN (sobre los componentes de las maquetas) */
button.tarjeta, button.fila, button.producto { text-align: left; width: 100%; font: inherit; color: inherit; }
button.tarjeta { cursor: pointer; }
button.tarjeta:hover { border-color: #D6C8B6; }
.lista > button.fila { background: none; border: 0; }
.lista > button.fila:hover { background: var(--a-fondo); }
.boton { cursor: pointer; border: 0; }
.boton:hover { filter: brightness(1.06); }
.boton:disabled { opacity: .45; cursor: not-allowed; filter: none; }
.boton.peligro { background: var(--a-error); }
.boton.sec.peligro { background: var(--a-tarjeta); color: var(--a-error); border-color: #EBC3BE; }
.enlace { cursor: pointer; }
.enlace.peligro { color: var(--a-error); }
.cab .volver { cursor: pointer; }

.campo { min-width: 0; }
.campo .entrada { transition: border-color .15s, box-shadow .15s; min-width: 0; }
.campo .entrada:focus-within { border-color: var(--a-acento); box-shadow: 0 0 0 3px var(--a-suave); }
.campo .entrada input, .campo .entrada select { border: 0; outline: 0; background: transparent; flex: 1; min-width: 0; height: 52px; font-size: 18px; color: var(--a-tinta); padding: 0; }
.campo .entrada select { appearance: none; cursor: pointer; }
.campo .entrada input::placeholder, .campo textarea::placeholder { color: #9A9EA8; }
.campo .entrada .ojo { border: 0; background: none; padding: 6px; margin-right: -6px; color: var(--a-tenue); display: grid; }
.campo textarea.entrada { display: block; min-height: 96px; outline: 0; line-height: 1.4; }
.campo .ayuda { font-size: 13.5px; color: var(--a-tenue); }
.campo .cuenta { font: 500 12.5px/1 var(--f-mono); color: var(--a-tenue); justify-self: end; }
.campo .cuenta.pasa { color: var(--a-error); }
.campo .error { display: none; font-size: 14px; font-weight: 600; color: var(--a-error); align-items: flex-start; gap: 6px; line-height: 1.3; }
.campo .error .i { width: 16px; height: 16px; margin-top: 1px; }
.campo.mal .error { display: flex; }
.campo.mal .entrada, .campo.mal textarea.entrada { border-color: var(--a-error); box-shadow: 0 0 0 3px var(--a-error-suave); }
.campo.mal .contador, .campo.mal .chips .chip { border-color: var(--a-error); }
.campo.bien .entrada { border-color: var(--a-ok); }
.temblor { animation: temblor .35s; }
@keyframes temblor { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

.aviso-form { display: flex; gap: 10px; align-items: flex-start; border-radius: 14px; padding: 12px 14px; background: var(--a-error-suave); color: var(--a-error); font-weight: 600; font-size: 15px; line-height: 1.35; }
.aviso-form.info { background: var(--a-azul-suave); color: #234F73; }
.aviso-form.ok { background: var(--a-ok-suave); color: var(--a-ok); }

.fuerza { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.fuerza i { height: 5px; border-radius: 3px; background: var(--a-linea); }
.fuerza[data-n="1"] i:nth-child(-n+1) { background: var(--a-error); }
.fuerza[data-n="2"] i:nth-child(-n+2) { background: var(--a-aviso); }
.fuerza[data-n="3"] i:nth-child(-n+3) { background: var(--a-verde); }
.fuerza[data-n="4"] i { background: var(--a-ok); }

.contador button { cursor: pointer; }
.contador button:disabled { opacity: .3; cursor: default; }
.interruptor { border: 0; padding: 0; cursor: pointer; }
.interruptor::after { transition: left .15s; }
.segmentos button { text-align: center; padding: 10px 6px; border-radius: 10px; font: 600 15px/1.2 var(--f-texto); color: var(--a-tenue); background: none; border: 0; }
.segmentos button.on { background: var(--a-tarjeta); color: var(--a-tinta); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.chip { cursor: pointer; }
button.radio { width: 100%; text-align: left; cursor: pointer; }
button.casilla { background: none; border: 0; padding: 0; text-align: left; cursor: pointer; }

.push.en-app { cursor: pointer; animation: baja .35s ease-out; }
@keyframes baja { from { transform: translateY(-30px); opacity: 0; } }
.push .cerrar { background: none; border: 0; padding: 2px; color: var(--a-tenue); display: grid; }

.velo { animation: aparece .2s; }
.hoja { animation: sube .25s ease-out; max-height: 88%; overflow-y: auto; color: var(--a-tinta); }
@keyframes aparece { from { opacity: 0; } }
@keyframes sube { from { transform: translateY(40px); opacity: .4; } }

.toast { position: absolute; left: 16px; right: 16px; bottom: 96px; z-index: 9; background: var(--a-tinta); color: #fff; border-radius: 14px; padding: 12px 14px; display: flex; gap: 10px; align-items: center; font-size: 15px; font-weight: 500; box-shadow: 0 12px 30px -12px rgba(0,0,0,.5); animation: sube .25s ease-out; }
.toast .i { color: #9FD8B3; }
.toast.error .i { color: #F3A79D; }

.vacio { display: grid; justify-items: center; text-align: center; gap: 8px; padding: 26px 12px; color: var(--a-tenue); }
.vacio .circulo { margin-bottom: 4px; }

.codigo-grande { font: 700 34px/1 var(--f-mono); letter-spacing: .2em; text-align: center; padding: 14px 0; border: 2px dashed var(--a-linea); border-radius: 14px; background: var(--a-tarjeta); }
.lineas { display: grid; gap: 6px; }
.lineas .fila { justify-content: space-between; }

/* Tamaño de letra y contraste de la app (ajustes del vecino) */
.pantalla-app.t-grande .cuerpo, .pantalla-app.t-grande .pie-acciones, .pantalla-app.t-grande .hoja { zoom: 1.08; }
.pantalla-app.t-muy-grande .cuerpo, .pantalla-app.t-muy-grande .pie-acciones, .pantalla-app.t-muy-grande .hoja { zoom: 1.16; }
.pantalla-app.contraste { --a-tenue: #2E333D; --a-linea: #8D8478; --a-fondo: #FFFFFF; --a-crema: #EDE4D6; --a-acento: #9A3519; }
.pantalla-app.contraste .tarjeta, .pantalla-app.contraste .campo .entrada { border-width: 2px; }

/* ============================================================================= PANEL WEB */
.panel { min-height: calc(100dvh - 48px); display: grid; grid-template-columns: 250px 1fr; background: var(--a-fondo); color: var(--a-tinta); border-radius: 14px; overflow: clip; box-shadow: 0 30px 70px -35px rgba(30, 20, 10, .45), 0 0 0 1px rgba(0,0,0,.12); max-width: 1440px; margin: 0 auto; position: relative; }
.lateral { background: var(--a-tinta); color: #D9DCE3; padding: 22px 14px; display: flex; flex-direction: column; gap: 4px; }
.lateral .marca { display: flex; align-items: center; gap: 10px; padding: 0 10px 18px; color: #fff; font: 700 24px/1 var(--f-display); }
.lateral .marca .logo { width: 34px; height: 34px; border-radius: 9px; background: var(--a-acento); display: grid; place-items: center; }
.lateral .marca .logo .i { width: 19px; height: 19px; }
.lateral nav { display: grid; gap: 2px; }
.lateral nav button, .lateral .acciones button { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; color: inherit; background: none; border: 0; font-weight: 500; font-size: 15px; text-align: left; width: 100%; }
.lateral nav button:hover, .lateral .acciones button:hover { background: rgba(255,255,255,.06); }
.lateral nav button.activo { background: rgba(255,255,255,.1); color: #fff; font-weight: 600; }
.lateral nav button.activo .i { color: #F19A7C; }
.lateral .grupo-eti { font: 500 11px/1 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: #8E94A3; padding: 18px 12px 8px; }
.lateral .pueblos { display: grid; gap: 2px; }
.lateral .pueblos button { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 10px; background: none; border: 0; color: inherit; font-size: 14.5px; text-align: left; }
.lateral .pueblos button.activo { color: #fff; font-weight: 600; background: rgba(255,255,255,.06); }
.lateral .pueblos button .p { width: 8px; height: 8px; border-radius: 50%; background: #5E6577; }
.lateral .pueblos button.activo .p { background: #F19A7C; }
.lateral .usuario { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 14px 10px 6px; border-top: 1px solid rgba(255,255,255,.12); font-size: 14px; }
.lateral .usuario small { display: block; color: #8E94A3; font-size: 12.5px; }
.lateral .usuario .avatar { width: 36px; height: 36px; font-size: 14px; }
.lateral .acciones { display: grid; gap: 2px; }
.lateral .acciones button { font-size: 14px; padding: 8px 12px; color: #B9BECB; }
.principal-web { display: flex; flex-direction: column; min-width: 0; }
.cab-web { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 22px 32px 16px; border-bottom: 1px solid var(--a-linea); }
.cab-web h1 { margin: 0; font: 700 28px/1.1 var(--f-display); flex: 1; min-width: 200px; }
.cab-web .boton { width: auto; min-height: 44px; font-size: 15px; border-radius: 12px; }
.contenido-web { padding: 22px 32px 40px; display: grid; gap: 20px; align-content: start; min-width: 0; }
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
.kpi { background: var(--a-tarjeta); border: 1px solid var(--a-linea); border-radius: 16px; padding: 16px 18px; display: grid; gap: 4px; }
.kpi .eti { font-size: 11px; }
.kpi b { font: 700 34px/1.05 var(--f-display); font-variant-numeric: tabular-nums; }
.kpi span { font-size: 13.5px; color: var(--a-tenue); }
.columnas-web { display: grid; gap: 20px; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); align-items: start; }
.columnas-web > * { min-width: 0; }
.tabla-marco { overflow-x: auto; }
.tabla { width: 100%; border-collapse: collapse; font-size: 14.5px; }
.tabla th { text-align: left; font: 500 11px/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--a-tenue); padding: 0 12px 10px 0; border-bottom: 1px solid var(--a-linea); white-space: nowrap; }
.tabla td { padding: 10px 12px 10px 0; border-bottom: 1px solid var(--a-linea); vertical-align: middle; }
.tabla tr:last-child td { border-bottom: 0; }
.tabla .t2 { display: block; color: var(--a-tenue); font-size: 13px; }
.tabla .acciones-fila { display: flex; gap: 6px; justify-content: flex-end; }
.form-web { display: grid; gap: 16px; }
.form-web .dos { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.form-web .tres { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.form-web .campo .entrada { min-height: 46px; font-size: 15.5px; border-radius: 11px; }
.form-web .campo .entrada input, .form-web .campo .entrada select { height: 44px; font-size: 15.5px; }
.form-web .campo textarea.entrada { font-size: 15.5px; }
.form-web .campo label, .form-web .campo .lbl { font-size: 14px; }
.form-web .botones { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
.form-web .botones .boton { width: auto; min-height: 46px; font-size: 15.5px; border-radius: 12px; }
.casilla { display: flex; align-items: center; gap: 10px; font-size: 15px; }
.casilla i { width: 22px; height: 22px; border-radius: 6px; border: 1.5px solid var(--a-linea); background: var(--a-tarjeta); display: grid; place-items: center; flex: none; }
.casilla i.on { background: var(--a-acento); border-color: var(--a-acento); color: #fff; }
.casilla i .i { width: 15px; height: 15px; stroke-width: 3; }
.radio { display: flex; align-items: center; gap: 10px; font-size: 15px; padding: 12px 14px; border: 1.5px solid var(--a-linea); border-radius: 12px; background: var(--a-tarjeta); }
.radio i { width: 20px; height: 20px; border-radius: 50%; border: 2px solid #B9B1A6; flex: none; }
.radio.on { border-color: var(--a-acento); background: var(--a-suave); }
.radio.on i { border: 6px solid var(--a-acento); }
.panel .velo { position: fixed; }
.modal { position: fixed; z-index: 6; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(520px, calc(100vw - 32px)); max-height: calc(100dvh - 48px); overflow-y: auto; background: var(--a-fondo); color: var(--a-tinta); border-radius: 20px; padding: 22px; display: grid; gap: 16px; box-shadow: 0 30px 70px -20px rgba(0,0,0,.5); }
.panel .toast { position: fixed; left: auto; right: 24px; bottom: 24px; width: min(420px, calc(100vw - 48px)); }
.vista-movil { border: 1px solid var(--a-linea); border-radius: 18px; background: var(--a-crema); padding: 16px; display: grid; gap: 10px; }

/* Panel en pantallas estrechas: menú arriba */
@media (max-width: 900px) {
  body { padding-block: 0; }
  .demo.web { margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))); }
  .panel { grid-template-columns: minmax(0, 1fr); border-radius: 0; min-height: 100dvh; box-shadow: none; }
  .lateral { min-width: 0; }
  .lateral { padding: 14px 12px; padding-top: max(14px, env(safe-area-inset-top, 0px)); }
  .lateral .marca { padding-bottom: 10px; }
  .lateral nav { display: flex; overflow-x: auto; gap: 4px; }
  .lateral nav button { white-space: nowrap; width: auto; }
  .lateral .grupo-eti { padding-top: 10px; }
  .lateral .pueblos { display: flex; flex-wrap: wrap; }
  .lateral .usuario { margin-top: 8px; }
  .lateral .acciones { display: flex; flex-wrap: wrap; }
  .lateral .acciones button { width: auto; }
  .cab-web, .contenido-web { padding-left: 16px; padding-right: 16px; }
  .kpis { grid-template-columns: 1fr 1fr; }
  .columnas-web, .form-web .dos, .form-web .tres { grid-template-columns: 1fr; }
}

@media (max-width: 560px) { .demo.web { margin: 0; } }

/* ============================================================================= TABLÓN */
.tablon-marco { width: 100%; position: relative; overflow: hidden; border-radius: 10px; background: #0F1115; padding: 8px; }
.tablon-escala { transform-origin: 0 0; }
.tablon-completo { position: fixed; inset: 0; z-index: 20; background: #0F1115; display: grid; place-items: center; padding: max(12px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
.tablon-completo .salir { position: absolute; top: max(12px, env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); z-index: 2; background: rgba(255,255,255,.12); color: #fff; border: 0; border-radius: 999px; padding: 10px 16px; font-weight: 600; display: flex; gap: 8px; align-items: center; }
.tablon-completo .tablon-marco { background: none; padding: 0; }

/* La guía también se abre dentro de la app (hoja) y en el panel web (ventana): usa la paleta de la app */
.hoja, .modal { --mesa-tinta: var(--a-tinta); --mesa-tenue: var(--a-tenue); --mesa-linea: var(--a-linea); --mesa-acento: var(--a-acento); --mesa-tarjeta: var(--a-tarjeta); }
.guia-compacta p { margin: 0; }
.pantalla-app.portada { background: var(--a-acento); color: #fff; }

</style>

const sumaDias = (iso, n) => { const d = deIso(iso); d.setDate(d.getDate() + n); return isoDia(d); };
const diaIso = iso => { const g = deIso(iso).getDay(); return g === 0 ? 7 : g; }; // 1 = lunes … 7 = domingo
const letraDe = iso => LETRA[deIso(iso).getDay()];
const hm = min => `${pad(Math.floor(min / 60) % 24)}:${pad(Math.round(min) % 60)}`;
const aMin = txt => { const [h, m] = txt.split(':').map(Number); return h * 60 + m; };

/* Reloj de la demo: empieza a las 10:25 del día en que se abre y avanza con el reloj real.
   Así la ruta del pan siempre va «de camino» al empezar, sea la hora que sea. */
function ahoraMs() { return db.meta.base + (Date.now() - db.meta.inicio) + db.meta.adelanto * 60000; }
function hoy() { return db.meta.dia; }
function minAhora() { const d = new Date(ahoraMs()); return d.getHours() * 60 + d.getMinutes() + (isoDia(d) > hoy() ? 1440 : 0); }
function tsDe(iso, txt) { const d = deIso(iso); const [h, m] = txt.split(':').map(Number); d.setHours(h, m, 0, 0); return d.getTime(); }

function etiquetaDia(iso, conMes = false) {
  const d = deIso(iso);
  const resto = `${DIAS[d.getDay()]} ${d.getDate()}${conMes ? ` de ${MESES[d.getMonth()]}` : ''}`;
  if (iso === hoy()) return `Hoy, ${resto}`;
  if (iso === sumaDias(hoy(), 1)) return `Mañana, ${resto}`;
  if (iso === sumaDias(hoy(), -1)) return `Ayer, ${resto}`;
  return resto.charAt(0).toUpperCase() + resto.slice(1);
}
function diaCorto(iso) {
  if (iso === hoy()) return 'Hoy';
  if (iso === sumaDias(hoy(), 1)) return 'Mañana';
  if (iso === sumaDias(hoy(), -1)) return 'Ayer';
  const d = deIso(iso); return `${DIAS[d.getDay()].slice(0, 3)} ${d.getDate()}`;
}
function haceTxt(ts) {
  const min = Math.round((ahoraMs() - ts) / 60000);
  if (min < 1) return 'Ahora mismo';
  if (min < 60) return `Hace ${min} min`;
  const h = Math.round(min / 60);
  if (h < 24) return `Hace ${h} h`;
  const d = Math.round(h / 24);
  return d === 1 ? 'Ayer' : `Hace ${d} días`;
}
function textoDias(letras) {
  const lista = letras.split('').map(l => DIAS_PL[LETRA.indexOf(l)]);
  if (letras === 'LMXJV') return 'de lunes a viernes';
  if (letras === 'LMXJVS') return 'de lunes a sábado';
  if (letras === 'LMXJVSD') return 'todos los días';
  return lista.length > 1 ? `${lista.slice(0, -1).join(', ')} y ${lista.at(-1)}` : lista[0];
}

/* ---------------------------------------------------------------- guardar / cargar */
function cargarDatos() {
  let guardado = null;
  try { guardado = JSON.parse(localStorage.getItem(CLAVE_DATOS) || 'null'); } catch (e) { guardado = null; }
  // Si los datos son de otro día se empieza de nuevo, para que «hoy» cuadre
  if (guardado && guardado.meta && guardado.meta.version === 1 && guardado.meta.dia === isoDia(new Date())) return guardado;
  return semilla();
}

function euros(n) { return n == null ? '—' : n.toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €'; }
function cantidadTxt(c, unidad) {
  const n = String(c).replace('.', ',');
  if (unidad === 'UNIDAD') return `×${n}`;
  const [s, p] = UNIDAD[unidad];
  return `${n} ${c === 1 ? s : p}`;
}
function importe(e) { return e.lineas.reduce((t, l) => t + (l.precio == null ? 0 : l.precio * l.cantidad), 0); }
function resumenLineas(e) { return e.lineas.map(l => `${l.desc} ${cantidadTxt(l.cantidad, l.unidad)}`).join(' · '); }

function vendedorDeEncargo(e) { return usuario(parada(e.parada_id).vendedor_id); }

/* Paradas del día de un vendedor, en orden */
function rutaHoy(vid) { return db.paradas.filter(p => p.vendedor_id === vid && p.fecha === hoy()).sort((a, b) => a.orden - b.orden); }
function paradasDe(vid) { return db.paradas.filter(p => p.vendedor_id === vid).sort((a, b) => a.orden - b.orden); }
function estadoRuta(vid) {
  const r = rutaHoy(vid);
  if (!r.length) return 'SIN_RUTA';
  if (r.every(p => p.estado === 'CANCELADA')) return 'CANCELADA';
  if (r.every(p => ['HECHA', 'CANCELADA'].includes(p.estado))) return 'TERMINADA';
  if (r.every(p => p.estado === 'PREVISTA')) return 'PREVISTA';
  return 'EN_CURSO';
}
function siguienteParada(vid) { return rutaHoy(vid).find(p => ['EN_CAMINO', 'EN_PARADA', 'PREVISTA'].includes(p.estado)); }
function hora(p, fecha = hoy()) {
  // Hora estimada de una parada para un día (hoy: la calculada; otro día: salida + minutos)
  if (fecha === hoy() && p.fecha === hoy() && p.estimada != null) return p.estimada;
  return aMin(usuario(p.vendedor_id).hora_salida) + p.minutos;
}

/* Días en que se puede encargar a una parada, respetando la antelación del vendedor */
function fechasEncargo(p, cuantas = 5) {
  const v = usuario(p.vendedor_id);
  const out = [];
  for (let k = 0; k < 21 && out.length < cuantas; k++) {
    const f = sumaDias(hoy(), k);
    if (k === 0) {
      if (p.fecha !== hoy() || !['PREVISTA', 'EN_CAMINO'].includes(p.estado)) continue;
    } else if (!v.dias_reparto.includes(letraDe(f))) continue;
    const llegada = tsDe(f, hm(hora(p, f)));
    if (llegada - ahoraMs() >= v.horas_antelacion_encargo * 3600000) out.push(f);
  }
  return out;
}
function proximoReparto(v, desde = hoy()) {
  for (let k = 0; k < 8; k++) { const f = sumaDias(desde, k); if (v.dias_reparto.includes(letraDe(f))) return f; }
  return null;
}

/* Consulta médica de un pueblo un día: el cambio de ese día manda sobre el horario habitual */
function consultasDia(mid, iso) {
  const cambios = db.consultas.filter(c => c.municipio_id === mid && c.fecha === iso);
  const habituales = db.consultas.filter(c => c.municipio_id === mid && c.dia_semana === diaIso(iso) && !cambios.some(x => x.tipo === c.tipo));
  return [...cambios.map(c => ({ ...c, cambio: true })), ...habituales.map(c => ({ ...c, cambio: false }))].sort((a, b) => a.inicio.localeCompare(b.inicio));
}

function avisoVigente(a) { const t = ahoraMs(); return a.estado === 'PUBLICADO' && a.desde <= t && (a.hasta == null || a.hasta >= t); }
function avisosPara(mid) { return db.avisos.filter(a => avisoVigente(a) && (a.municipio_id == null || a.municipio_id === mid)).sort((a, b) => (b.prioridad !== 'NORMAL') - (a.prioridad !== 'NORMAL') || b.desde - a.desde); }

/* Familia */
function familiaresDe(vid, estado = 'ACEPTADO') { return db.familiares.filter(f => f.vecino_id === vid && (!estado || f.estado === estado)); }
function ayudadosPor(fid, estado = 'ACEPTADO') { return db.familiares.filter(f => f.familiar_id === fid && (!estado || f.estado === estado)); }

/* A quién llega un aviso sobre un vecino: él (si tiene móvil) y sus familiares que reciben avisos */
function destinatarios(vecinoIds) {
  const set = new Set();
  vecinoIds.forEach(id => {
    const u = usuario(id); if (!u || !u.activo) return;
    if (u.password) set.add(id);
    familiaresDe(id).filter(f => f.recibe_avisos).forEach(f => set.add(f.familiar_id));
  });
  return [...set];
}
function notificar(uids, icono, titulo, texto) {
  uids.forEach(uid => db.notis.unshift({ id: siguienteId('noti'), uid, icono, titulo, texto, ts: ahoraMs(), leida: false }));
  return uids.length;
}

  const id = `f-${n}`;

  }
  const cuenta = max ? `<span class="cuenta" data-cuenta="${n}">${String(v).length} / ${max}</span>` : '';
  return `<div class="campo" data-campo="${n}"><label for="${id}">${l}</label>${control}
      ${ayuda || cuenta ? `<div style="display:flex;gap:10px;justify-content:space-between">${ayuda ? `<span class="ayuda">${ayuda}</span>` : '<span></span>'}${cuenta}</div>` : ''}
      <p class="error" id="e-${n}" role="alert"></p></div>`;
}

/* ---------------------------------------------------------------- reglas de validación */
const RE_EMAIL = /^[^\s@]+@[^\s@]+\.[A-Za-z]{2,}$/;
const RE_NOMBRE = /^[A-Za-zÁÉÍÓÚÜÑáéíóúüñÀÈÌÒÙàèìòùÇçÏï'·. -]+$/;
const normTel = v => v.replace(/[\s.\-()]/g, '').replace(/^(\+34|0034)/, '');
const V = {
  nombre(v, que = 'tu nombre') {

    if (v.length < 2) return 'Es demasiado corto: pon al menos 2 letras.';
    if (v.length > 60) return 'Es demasiado largo: máximo 60 letras.';
    if (!RE_NOMBRE.test(v)) return 'Usa solo letras, sin números ni símbolos.';
  },
  telefono(v, { opcional = false, movil = false } = {}) {
    const t = normTel(v);
    if (!t) return opcional ? undefined : 'Escribe el número de teléfono.';
    if (/[^\d]/.test(t)) return 'El teléfono solo puede llevar números.';
    if (t.length !== 9) return `El teléfono tiene que tener 9 cifras y tiene ${t.length}. Ejemplo: 600 111 222.`;
    if (!/^[6789]/.test(t)) return 'Los teléfonos de España empiezan por 6, 7, 8 o 9.';
    if (movil && !/^[67]/.test(t)) return 'Para recibir avisos hace falta un móvil (empieza por 6 o 7).';
  },
  email(v, { opcional = false } = {}) {
    v = v.trim();
    if (!v) return opcional ? undefined : 'Escribe tu correo.';
    if (!v.includes('@')) return 'Al correo le falta la @. Ejemplo: nombre@correo.es';
    if (!RE_EMAIL.test(v)) return 'El correo no está bien escrito. Ejemplo: nombre@correo.es';
    if (v.length > 120) return 'El correo es demasiado largo.';
  },
  password(v) {
    if (!v) return 'Escribe una contraseña.';
    if (v.length < 8) return `La contraseña tiene que tener al menos 8 caracteres (llevas ${v.length}).`;
    if (!/[A-Za-zÁÉÍÓÚáéíóúÑñ]/.test(v) || !/\d/.test(v)) return 'La contraseña tiene que llevar al menos una letra y un número.';
    if (v.length > 72) return 'Máximo 72 caracteres.';
  },
  texto(v, { min = 0, max = 200, que = 'este campo', opcional = false } = {}) {
    v = v.trim();
    if (!v) return opcional ? undefined : `Rellena ${que}.`;
    if (v.length < min) return `Escribe al menos ${min} caracteres (llevas ${v.length}).`;
    if (v.length > max) return `Máximo ${max} caracteres (llevas ${v.length}).`;
  },
};
function fuerzaClave(v) {
  if (!v) return 0;
  let n = 0;
  if (v.length >= 8) n++;
  if (/[A-Za-z]/.test(v) && /\d/.test(v)) n++;
  if (/[A-Z]/.test(v) && /[a-z]/.test(v)) n++;
  if (/[^A-Za-z0-9]/.test(v) || v.length >= 12) n++;
  return Math.max(1, n);
}
function buscarCuenta(texto) {
  const t = texto.trim().toLowerCase();
  return t.includes('@') ? db.usuarios.find(u => u.email && u.email === t) : db.usuarios.find(u => u.telefono && u.telefono === normTel(t));
}

const REGLAS = {
  entrar: {
    usuario(v) {
      v = v.trim();
      if (!v) return 'Escribe tu teléfono o tu correo.';
      if (v.includes('@')) return V.email(v);
      const t = normTel(v);
      if (/[^\d]/.test(t)) return 'Escribe un teléfono (solo números) o un correo con @.';
      if (t.length !== 9) return `El teléfono tiene que tener 9 cifras y tiene ${t.length}. Ejemplo: 600 111 222.`;
    },
    password: v => v ? undefined : 'Escribe tu contraseña.',
  },
  olvido: {
    usuario: v => REGLAS.entrar.usuario(v) || (buscarCuenta(v) ? undefined : 'No hay ninguna cuenta con ese teléfono o correo.'),
  },
  registro: {
    nombre: v => V.nombre(v),
    apellidos: v => V.nombre(v, 'tus apellidos'),
    telefono: v => V.telefono(v, { movil: true }) || (db.usuarios.some(u => u.telefono === normTel(v)) ? 'Ya hay una cuenta con este teléfono. Entra con él o usa otro.' : undefined),
    email: v => V.email(v, { opcional: true }) || (v.trim() && db.usuarios.some(u => u.email === v.trim().toLowerCase()) ? 'Ya hay una cuenta con este correo.' : undefined),
    password: v => V.password(v),
    password2: (v, t) => !v ? 'Repite la contraseña.' : (v !== t.password ? 'Las dos contraseñas no son iguales.' : undefined),
    municipio: v => v ? undefined : 'Elige tu pueblo.',
    direccion: v => V.texto(v, { min: 4, max: 120, opcional: true }),
    condiciones: v => v ? undefined : 'Tienes que aceptar las condiciones para crear la cuenta.',
  },
};

/* ---------------------------------------------------------------- envío de formularios */
const ENVIOS = {
  entrar(vals) {
    const clave = vals.usuario.trim().toLowerCase();
    const bloqueo = S.bloqueo[clave];
    if (bloqueo && bloqueo > Date.now()) return { password: `Has fallado 5 veces. Espera ${Math.ceil((bloqueo - Date.now()) / 1000)} segundos y vuelve a probar.` };
    const u = buscarCuenta(vals.usuario);
    if (!u) return { usuario: 'No hay ninguna cuenta con ese teléfono o correo. Revisa que esté bien escrito o crea una cuenta.' };
    if (!u.password) return { usuario: 'Esta persona no tiene cuenta para entrar: la gestiona un familiar desde su móvil.' };
    if (!u.activo) return { usuario: `Esta cuenta se dio de baja el ${new Date(u.fecha_baja).toLocaleDateString('es-ES')}. Si quieres volver, habla con tu ayuntamiento.` };
    if (vals.password !== u.password) {
      const n = (S.intentos[clave] || 0) + 1;
      S.intentos[clave] = n;
      if (n >= 5) { S.bloqueo[clave] = Date.now() + 30000; S.intentos[clave] = 0; return { password: 'Has fallado 5 veces. Por seguridad, espera 30 segundos y vuelve a probar.' }; }
      return { password: `La contraseña no es correcta. Te ${5 - n === 1 ? 'queda 1 intento' : `quedan ${5 - n} intentos`}. Fíjate en mayúsculas y minúsculas.` };
    }
    S.intentos[clave] = 0;
    iniciarSesion(u);
  },
  olvido(vals) {
    const u = buscarCuenta(vals.usuario);
    S.vista = { n: 'entrar', p: {} }; S.pila = [{ n: 'bienvenida', p: {} }];
    toast(u.telefono && !vals.usuario.includes('@') ? `Te hemos enviado un SMS al ${telTxt(u.telefono)} (en la demo no llega).` : `Te hemos enviado un correo a ${u.email} (en la demo no llega).`);
    render();
  },
  registro(vals) {
    const id = siguienteId('usuario');
    const mid = Number(vals.municipio);
    const codigo = Array.from({ length: 6 }, () => 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random() * 32)]).join('');
    db.usuarios.push({ id, roles: ['VECINO'], nombre: vals.nombre.trim(), apellidos: vals.apellidos.trim(), email: vals.email.trim().toLowerCase() || null,
      telefono: normTel(vals.telefono), password: vals.password, municipio_id: mid, direccion: vals.direccion.trim() || null, codigo_familia: codigo,
      idioma: 'es', tamano_texto: 'NORMAL', alto_contraste: false, activo: true, fecha_baja: null, necesita_ayuda_entrega: false, notas_entrega: null,
      nombre_comercial: null, categoria: null, dias_reparto: null, hora_salida: null, acepta_encargos: false, horas_antelacion_encargo: 0,
      email_verificado: false, fecha_alta: ahoraMs(), ultimo_acceso: ahoraMs() });
    // Se suscribe a todos los vendedores que pasan por su pueblo (lo puede cambiar en Ajustes)
    vendedores().filter(v => db.paradas.some(p => p.vendedor_id === v.id && p.municipio_id === mid))
      .forEach(v => db.suscripciones.push({ vecino_id: id, vendedor_id: v.id, minutos: 15, activa: true }));
    guardar();
    iniciarSesion(usuario(id), `Cuenta creada. Bienvenida o bienvenido, ${vals.nombre.trim()}.`);
  },
};

function iniciarSesion(u, mensaje) {
  S.uid = u.id; u.ultimo_acceso = ahoraMs(); guardar();
  if (u.roles.length > 1) { S.rol = null; S.pila = []; S.vista = { n: 'elegir-perfil', p: {} }; render(); return; }
  entrarComo(u.roles[0], mensaje);
}
function entrarComo(rol, mensaje) {
  S.rol = rol; S.pila = []; S.hoja = null; S.seg = {}; S.borrador = null;
  S.vista = { n: INICIO[rol], p: {} };
  S.pueblo = pueblosGestionados()[0]?.id ?? null;
  guardarSesion();
  toast(mensaje || `Hola, ${yo().nombre}. Has entrado como ${ROL_NOMBRE[rol].toLowerCase()}.`);
  render();
}
function cerrarSesion(mensaje = 'Has cerrado la sesión.') {
  S.uid = null; S.rol = null; S.pila = []; S.hoja = null; S.borrador = null; S.seg = {};
  S.vista = { n: 'bienvenida', p: {} };
  guardarSesion();
  if (mensaje) toast(mensaje);
  render();
}

/* ---------------------------------------------------------------- eventos */
function engancharEventos() {
  const raiz = document.getElementById('demo');
  document.addEventListener('click', ev => {
    const el = ev.target.closest('[data-a]');
    if (!el || !document.body.contains(el)) return;
    const fn = ACC[el.dataset.a];
    if (!fn) { console.warn('Acción sin definir', el.dataset.a); return; }
    ev.preventDefault();
    fn(el.dataset, el, ev);
  });
  document.addEventListener('submit', ev => {
    const f = ev.target.closest('form[data-form]');
    if (!f) return;
    ev.preventDefault();
    const id = f.dataset.form;
    const vals = leerForm(f, ev.submitter);
    let errores = validar(id, vals);
    if (!Object.keys(errores).length && ENVIOS[id]) errores = ENVIOS[id](vals, f) || {};
    if (Object.keys(errores).length) pintarErrores(f, errores);
  });
  document.addEventListener('input', ev => {
    const t = ev.target;
    const f = t.closest('form[data-form]');
    if (t.name && f) limpiarError(f, t.name);
    if (t.dataset.max) {
      const c = f && f.querySelector(`[data-cuenta="${t.name}"]`);
      if (c) { c.textContent = `${t.value.length} / ${t.dataset.max}`; c.classList.toggle('pasa', t.value.length > Number(t.dataset.max)); }
    }
    if (t.hasAttribute('data-fuerza')) { const m = f.querySelector('.fuerza'); if (m) m.dataset.n = fuerzaClave(t.value); }
    if (t.dataset.borrador && S.borrador) S.borrador[t.dataset.borrador] = t.value;
    if (f && VIVO[f.dataset.form]) VIVO[f.dataset.form](f);
  });
  // Al salir de un campo con algo escrito se comprueba en el momento
  document.addEventListener('focusout', ev => {
    const t = ev.target;
    const f = t.closest && t.closest('form[data-form]');
    if (!f || !t.name || t.type === 'hidden') return;
    const regla = (REGLAS[f.dataset.form] || {})[t.name];
    if (!regla || (!t.value && !f.querySelector(`[data-campo="${t.name}"].mal`))) return;
    const msg = regla(t.value, leerForm(f));
    if (msg) mostrarError(f, t.name, msg);
    else { limpiarError(f, t.name); const c = f.querySelector(`[data-campo="${t.name}"]`); if (c && t.value) c.classList.add('bien'); }
  });
  document.addEventListener('keydown', ev => {
    if (ev.key === 'Escape') { if (S.tablon) { S.tablon = null; render(); } else if (S.hoja) cerrarHoja(); }
  });
  window.addEventListener('resize', ajustarTablones);
  // El reloj de la barra de estado avanza solo
  setInterval(() => {
    document.querySelectorAll('.reloj-txt').forEach(el => { el.textContent = hm(minAhora()); });
  }, 15000);
}
const VIVO = {};   // vista previa en directo de algunos formularios

/* Tablón: se pinta a 1280 × 721 y se escala al ancho disponible */
function ajustarTablones() {
  document.querySelectorAll('.tablon-marco').forEach(m => {
    const e = m.querySelector('.tablon-escala'); if (!e) return;
    const completo = m.closest('.tablon-completo');
    const ancho = m.clientWidth - (completo ? 0 : 16);
    let k = ancho / 1280;
    if (completo) k = Math.min(k, (window.innerHeight - 24) / 721);
    e.style.transform = `scale(${k})`;
    e.style.width = '1280px';
    m.style.height = `${721 * k + (completo ? 0 : 16)}px`;
    if (completo) m.style.width = `${1280 * k}px`;
  });
}

function textoProgreso(p) {
  const v = usuario(p.vendedor_id);
  const anterior = rutaHoy(v.id).filter(x => x.orden < p.orden && x.estado === 'HECHA').at(-1);
  const desde = anterior ? (anterior.salida ?? anterior.llegada) : v.salida_real;
  const falta = p.estimada - minAhora();
  const pct = desde == null ? 10 : Math.max(6, Math.min(96, Math.round(100 * (minAhora() - desde) / Math.max(1, p.estimada - desde))));

}

  const encargos = db.encargos.filter(e => e.vecino_id === vec.id && e.fecha >= hoy() && ENCARGO_ACTIVO.includes(e.estado)).sort((a, b) => a.fecha.localeCompare(b.fecha));
  const importantes = avisosPara(mid).filter(a => a.prioridad !== 'NORMAL' && a.categoria !== 'SANIDAD');
  return `${tarjetaConsulta(mid, propio)}

      const v = usuario(p.vendedor_id); const c = CATEGORIA[v.categoria]; const prox = proximoReparto(v, sumaDias(hoy(), 1));
      return `<button class="fila" data-a="ir-servicio" data-id="${p.id}" data-vecino="${vec.id}"><span class="circulo ${c.circulo}">${ic(c.icono)}</span><div class="flex"><div class="t1">${esc(v.nombre_comercial)}</div><div class="t2">Pasa los ${textoDias(v.dias_reparto)} · próximo: ${diaCorto(prox).toLowerCase()}</div></div>${ic('chevron-right', 's')}</button>`;

function puedeEncargarPor(vecinoId) { return db.familiares.some(f => f.familiar_id === S.uid && f.vecino_id === vecinoId && f.estado === 'ACEPTADO' && f.puede_hacer_encargos); }
function paradaEn(vendedorId, mid) { return db.paradas.find(p => p.vendedor_id === vendedorId && p.municipio_id === mid); }

ACC['nuevo-encargo'] = d => {
  const vecinoId = d.vecino ? Number(d.vecino) : S.uid;
  if (vecinoId !== S.uid && !puedeEncargarPor(vecinoId)) { toast('No tienes permiso para hacer encargos por esta persona.', true); render(); return; }
  S.borrador = { vecino_id: vecinoId, vendedor_id: null, parada_id: null, fecha: '', cant: {}, extra: '', lugar: 'plaza', notas: '', creado_por: S.uid };
  if (d.vendedor) { elegirVendedor(Number(d.vendedor)); return; }
  ir('enc-vendedor');
};
function elegirVendedor(vid) {
  const b = S.borrador; const vec = usuario(b.vecino_id);
  const p = paradaEn(vid, vec.municipio_id);
  b.vendedor_id = vid; b.parada_id = p.id; b.cant = {}; b.extra = '';
  b.fecha = fechasEncargo(p)[0] || '';
  ir('enc-catalogo');
}
ACC['enc-vendedor'] = d => elegirVendedor(Number(d.id));

VISTAS['enc-vendedor'] = () => {
  const b = S.borrador; const vec = usuario(b.vecino_id);
  const lista = vendedores().filter(v => paradaEn(v.id, vec.municipio_id));
  return `${cab('¿A quién encargas?')}
    ${cuerpo(`${b.vecino_id !== S.uid ? `<div class="tarjeta crema" style="padding:12px 14px"><div class="fila peq">${ic('hand-heart', 's')}<span>Encargo para <b>${esc(nombreCompleto(vec))}</b> · ${esc(municipio(vec.municipio_id).nombre)}</span></div></div>` : ''}
      <div class="tarjeta sin-pad lista">${lista.map(v => {
        const c = CATEGORIA[v.categoria]; const p = paradaEn(v.id, vec.municipio_id); const fechas = fechasEncargo(p, 1);
        const ok = v.acepta_encargos && fechas.length;
        return `<button class="fila" ${ok ? `data-a="enc-vendedor" data-id="${v.id}"` : 'disabled style="opacity:.55"'}><span class="circulo ${c.circulo}">${ic(c.icono)}</span>
          <div class="flex"><div class="t1">${esc(v.nombre_comercial)}</div><div class="t2">${!v.acepta_encargos ? 'Ahora no acepta encargos' : fechas.length ? `Lo antes posible: ${diaCorto(fechas[0]).toLowerCase()}` : 'No hay días disponibles'}</div></div>${ok ? ic('chevron-right', 's') : ''}</button>`;
      }).join('')}</div>
      <p class="peq texto-t">Solo aparecen los vendedores que pasan por ${esc(municipio(vec.municipio_id).nombre)}.</p>`)}`;
};

function pasoCantidad(p) { return p.unidad === 'KG' ? 0.5 : 1; }
function maxCantidad(p) { return p.unidad === 'KG' ? 10 : 20; }
VISTAS['enc-catalogo'] = () => {
  const b = S.borrador; const v = usuario(b.vendedor_id); const p = parada(b.parada_id); const vec = usuario(b.vecino_id);
  const fechas = fechasEncargo(p);
  if (!fechas.includes(b.fecha)) b.fecha = fechas[0] || '';
  const prods = db.productos.filter(x => x.vendedor_id === v.id);
  const total = prods.reduce((t, x) => t + (b.cant[x.id] || 0) * x.precio, 0);
  const n = Object.values(b.cant).filter(Boolean).length + (b.extra.trim() ? 1 : 0);
  return `${cab(`Encargo a ${esc(v.nombre_comercial)}`)}
    <form data-form="enc-catalogo" novalidate style="display:contents">
    ${cuerpo(`${b.vecino_id !== S.uid ? `<div class="tarjeta crema" style="padding:12px 14px"><div class="fila peq">${ic('hand-heart', 's')}<span>Para <b>${esc(nombreCompleto(vec))}</b></span></div></div>` : ''}
      ${fechas.length ? grupoCampo('fecha', '¿Qué día?', chipsElegir('fecha', fechas.map(f => [f, `${diaCorto(f)} · ${hm(hora(p, f))}`]), b.fecha, false, 'data-borrador="fecha"'),
        `Recoges en ${esc(p.punto)} de ${esc(municipio(p.municipio_id).nombre)}. ${v.horas_antelacion_encargo ? `${esc(v.nombre_comercial)} pide ${v.horas_antelacion_encargo} h de antelación.` : ''}`)
        : `<div class="aviso-form">${ic('circle-alert', 's')}<span>Ahora no se puede encargar: ${esc(v.nombre_comercial)} pide ${v.horas_antelacion_encargo} h de antelación y no hay ningún reparto a tiempo.</span></div>`}
      ${grupoCampo('productos', 'Productos', `<div class="tarjeta sin-pad">${prods.map(x => {
        const c = b.cant[x.id] || 0;
        return `<div class="producto" ${x.disponible ? '' : 'style="opacity:.5"'}><div class="flex"><div class="t1">${esc(x.nombre)}</div><div class="t2 num">${x.disponible ? `${euros(x.precio)} ${x.unidad === 'UNIDAD' ? 'la unidad' : `el ${UNIDAD[x.unidad][0]}`}` : 'Agotado'}</div></div>
          ${x.disponible ? `<div class="contador ${c ? 'activo' : ''}"><button type="button" data-a="cant" data-id="${x.id}" data-d="-1" ${c ? '' : 'disabled'} aria-label="Quitar ${esc(x.nombre)}">${ic('minus', 's')}</button><b>${String(c).replace('.', ',')}</b><button type="button" data-a="cant" data-id="${x.id}" data-d="1" aria-label="Añadir ${esc(x.nombre)}">${ic('plus', 's')}</button></div>` : ''}</div>`;
      }).join('')}</div>`)}
      ${campo({ n: 'extra', l: '¿Algo que no está en la lista?', v: b.extra, ph: 'Por ejemplo: barra de centeno', icono: 'pencil', max: 60, extra: 'data-borrador="extra"' })}`, 'gap:14px')}
    ${pie(`<div class="fila" style="justify-content:space-between"><span class="texto-t">${plural(n, 'producto')}</span><b class="num" style="font-size:20px">${euros(total)}</b></div>
      <button class="boton" type="submit" ${fechas.length ? '' : 'disabled'}>Revisar encargo ${ic('arrow-right', 's')}</button>`)}
    </form>`;
};
ACC.cant = d => {
  const x = producto(Number(d.id)); const b = S.borrador;
  const actual = b.cant[x.id] || 0;
  const nuevo = Math.round((actual + Number(d.d) * pasoCantidad(x)) * 10) / 10;
  if (nuevo > maxCantidad(x)) { toast(`Máximo ${maxCantidad(x)} ${x.unidad === 'KG' ? 'kg' : ''} de ${x.nombre}. Si necesitas más, escríbelo en la nota.`.replace('  ', ' '), true); render(); return; }
  b.cant[x.id] = Math.max(0, nuevo);
  if (!b.cant[x.id]) delete b.cant[x.id];
  render();
};
REGLAS['enc-catalogo'] = {
  fecha: v => v ? undefined : 'Elige qué día lo quieres.',
  extra: v => V.texto(v, { max: 60, opcional: true }),
};
ENVIOS['enc-catalogo'] = vals => {
  const b = S.borrador; b.fecha = vals.fecha; b.extra = vals.extra;
  if (!Object.keys(b.cant).length && !b.extra.trim()) return { productos: 'Añade al menos un producto con el botón + o escribe lo que necesitas.' };
  const repetido = db.encargos.find(e => e.vecino_id === b.vecino_id && e.parada_id === b.parada_id && e.fecha === b.fecha && ENCARGO_ACTIVO.includes(e.estado));
  if (repetido) return { fecha: `Ya hay un encargo a ${usuario(b.vendedor_id).nombre_comercial} para ese día. Cancélalo en Encargos o elige otro día.` };
  ir('enc-revisar');
};

function lineasBorrador(b) {
  const lineas = Object.entries(b.cant).map(([id, c]) => { const x = producto(Number(id)); return { producto_id: x.id, desc: x.nombre, cantidad: c, unidad: x.unidad, precio: x.precio }; });
  if (b.extra.trim()) lineas.push({ producto_id: null, desc: b.extra.trim(), cantidad: 1, unidad: 'UNIDAD', precio: null });
  return lineas;
}
VISTAS['enc-revisar'] = () => {

        <div class="separa"></div>
        <div class="lineas">${lineas.map(l => `<div class="fila"><span>${esc(l.desc)} ${cantidadTxt(l.cantidad, l.unidad)}</span><span class="num">${l.precio == null ? 'precio al recoger' : euros(l.precio * l.cantidad)}</span></div>`).join('')}</div>
        <div class="separa"></div>
        <div class="fila" style="justify-content:space-between"><b>Total aproximado</b><b class="num" style="font-size:20px">${euros(total)}</b></div>
      </div>
      ${grupoCampo('lugar', '¿Dónde lo recoge' + (b.vecino_id === S.uid ? 's?' : ` ${esc(vec.nombre)}?`), radiosElegir('lugar', [
        ['plaza', `En ${esc(p.punto)}`, `Cuando pase ${esc(v.nombre_comercial)}`],
        ['casa', 'Que lo lleven a casa', vec.direccion ? `${esc(vec.direccion)} · si el vendedor puede` : 'Hace falta una dirección'],
      ], b.lugar))}
      ${campo({ n: 'notas', l: `Nota para ${esc(v.nombre_comercial)} (opcional)`, tipo: 'textarea', v: b.notas, ph: 'Por ejemplo: la barra poco hecha', max: 200, extra: 'data-borrador="notas"' })}
      <div class="fila texto-t peq" style="align-items:flex-start">${ic('wallet', 's')}<span>Se paga en mano al recogerlo. ${esc(v.nombre_comercial)} tiene que aceptar el encargo y te avisaremos.</span></div>`, 'gap:14px')}
    ${pie(`<button class="boton" type="submit">${ic('send', 's')} Enviar encargo</button>`)}
    </form>`;
};
REGLAS['enc-revisar'] = {
  lugar: v => v === 'casa' && !usuario(S.borrador.vecino_id).direccion ? 'Para que lo lleven a casa hace falta una dirección. Añádela en Ajustes › Mis datos.' : undefined,

};
ENVIOS['enc-revisar'] = vals => {

    a_domicilio: vals.lugar === 'casa', notas: vals.notas.trim() || null, motivo: null, creado: ahoraMs(), aceptado: null, preparado: null, entregado: null, lineas: lineasBorrador(b) };
  db.encargos.push(e);
  notificar([v.id], 'shopping-basket', `Nuevo encargo de ${nombreCompleto(vec)}`, `${diaCorto(e.fecha)} · ${municipio(vec.municipio_id).nombre}: ${resumenLineas(e)}`);

};

        <p class="texto-t" style="font-size:18px">${esc(v.nombre_comercial)} tiene que aceptarlo. ${S.uid === vec.id ? 'Te avisaremos' : `Os avisaremos a ti y a ${esc(vec.nombre)}`} en cuanto lo haga.</p></div>
      <div class="tarjeta" style="gap:8px"><div class="fila" style="justify-content:space-between"><span class="eti">${etiquetaDia(e.fecha)}</span>${pill('pend', 'Sin aceptar')}</div>

      ${fams.length ? `<div class="tarjeta crema" style="padding:12px 14px"><div class="fila peq">${ic('users', 's')}<span>${esc(fams.join(' y '))} también ${fams.length > 1 ? 'verán' : 'verá'} este encargo.</span></div></div>` : ''}`, 'justify-content:center;gap:20px;padding:20px 26px')}
    ${pie(`<button class="boton" data-a="pestana" data-v="${listaVista}">Ver los encargos</button><button class="boton sec" data-a="pestana" data-v="${INICIO[S.rol]}">Volver al inicio</button>`, 'border:0')}`;
};

/* ---------------------------------------------------------------- VECINO · Encargos */
function listaEncargos(vecinoIds, mostrarVecino) {
  const modo = seg('encargos', 'prox');
  const todos = db.encargos.filter(e => vecinoIds.includes(e.vecino_id));
  const prox = todos.filter(e => e.fecha >= hoy() && ENCARGO_ACTIVO.includes(e.estado)).sort((a, b) => a.fecha.localeCompare(b.fecha) || a.id - b.id);
  const ant = todos.filter(e => !prox.includes(e)).sort((a, b) => b.fecha.localeCompare(a.fecha) || b.id - a.id);
  const lista = modo === 'prox' ? prox : ant;
  return `${segmentos('encargos', [['prox', `Próximos · ${prox.length}`], ['ant', `Anteriores · ${ant.length}`]], 'prox')}
    ${lista.length ? lista.map(e => tarjetaEncargoCorta(e, mostrarVecino)).join('') : vacio('shopping-basket', modo === 'prox' ? 'No hay encargos pendientes' : 'Todavía no hay encargos anteriores')}`;
}
VISTAS['v-encargos'] = () => `${cab('Mis encargos', { volver: false })}
  ${cuerpo(listaEncargos([S.uid], false), 'gap:12px')}
  ${pie(`<button class="boton" data-a="nuevo-encargo">${ic('plus', 's')} Hacer un encargo</button>`)}
  ${navVecino('v-encargos')}`;

VISTAS['v-encargo'] = ({ id }) => {
  const e = encargo(id); const v = vendedorDeEncargo(e); const p = parada(e.parada_id); const vec = usuario(e.vecino_id);
  const [cl, txt] = ESTADO_ENCARGO[e.estado];
  const pasos = [['Enviado', e.creado], ['Aceptado', e.aceptado], ['Preparado', e.preparado], ['Entregado', e.entregado]];
  if (e.estado === 'RECHAZADO') pasos.splice(1, 3, ['Rechazado', e.creado]);
  if (e.estado === 'CANCELADO') pasos.splice(1, 3, ['Cancelado', e.cancelado || e.creado]);
  if (e.estado === 'NO_RECOGIDO') pasos.splice(3, 1, ['No se recogió', null]);
  const hecho = i => pasos[i][1] != null || (i === pasos.length - 1 && ['RECHAZADO', 'CANCELADO', 'NO_RECOGIDO'].includes(e.estado));
  const ultimo = pasos.map((x, i) => hecho(i)).lastIndexOf(true);
  const creador = usuario(e.creado_por);
  const parentesco = db.familiares.find(f => f.familiar_id === e.creado_por && f.vecino_id === e.vecino_id);
  const puedeCancelar = ['PENDIENTE', 'ACEPTADO'].includes(e.estado) && e.fecha >= hoy() && (S.uid === e.vecino_id || puedeEncargarPor(e.vecino_id));
  return `${cab('Encargo', { extra: pill(cl, txt) })}
    ${cuerpo(`<div class="tarjeta" style="gap:10px">
        <div class="fila"><span class="circulo ${CATEGORIA[v.categoria].circulo}">${ic(CATEGORIA[v.categoria].icono)}</span><div class="flex"><div class="t1">${esc(v.nombre_comercial)}</div><div class="t2">${etiquetaDia(e.fecha)} · hacia las ${hm(hora(p, e.fecha))}</div></div></div>
        <p class="peq texto-t">${e.a_domicilio ? `A domicilio: ${esc(vec.direccion || '')}` : `Recogida en ${esc(p.punto)}, ${esc(municipio(p.municipio_id).nombre)}`}</p>
      </div>
      ${e.estado === 'RECHAZADO' ? `<div class="aviso-form">${ic('circle-alert', 's')}<span>${esc(v.nombre_comercial)} no puede servirlo: «${esc(e.motivo)}»</span></div>` : ''}
      <ol class="tiempo">${pasos.map(([t, ts], i) => `<li><span class="h">${ts ? hm(new Date(ts).getHours() * 60 + new Date(ts).getMinutes()) : '—'}</span><span class="eje ${hecho(i) ? 'hecho' : 'pendiente'} ${i === ultimo ? 'actual' : ''}"><i></i></span><span class="d"><b>${t}</b><span>${ts ? diaCorto(isoDia(new Date(ts))) : ''}</span></span></li>`).join('')}</ol>
      <div class="tarjeta" style="gap:8px"><span class="eti">Productos</span><div class="lineas">${e.lineas.map(l => `<div class="fila"><span>${esc(l.desc)} ${cantidadTxt(l.cantidad, l.unidad)}</span><span class="num">${l.precio == null ? '—' : euros(l.precio * l.cantidad)}</span></div>`).join('')}</div>
        <div class="separa"></div><div class="fila" style="justify-content:space-between"><b>Total aproximado</b><b class="num">${euros(importe(e))}</b></div>
        ${e.notas ? `<p class="peq texto-t">Nota: «${esc(e.notas)}»</p>` : ''}</div>
      ${e.creado_por !== e.vecino_id ? `<div class="tarjeta crema" style="padding:12px 14px"><div class="fila peq">${ic('hand-heart', 's')}<span>Lo encargó ${esc(creador.nombre)}${parentesco ? ` (${esc(parentesco.parentesco.toLowerCase())})` : ''} para ${S.uid === vec.id ? 'ti' : esc(vec.nombre)}.</span></div></div>` : ''}`, 'gap:12px')}
    ${puedeCancelar ? pie(`<button class="boton sec peligro" data-a="hoja-confirmar" data-tipo="cancelar-encargo" data-id="${e.id}">Cancelar el encargo</button>`) : ''}`;
};

/* ---------------------------------------------------------------- VECINO · Avisos */

}
ACC['notis-leidas'] = () => { db.notis.filter(n => n.uid === S.uid).forEach(n => { n.leida = true; }); guardar(); render(); };
function horarioConsulta(mid) {
  const habitual = db.consultas.filter(c => c.municipio_id === mid && c.dia_semana).sort((a, b) => a.dia_semana - b.dia_semana || a.inicio.localeCompare(b.inicio));
  const cambios = db.consultas.filter(c => c.municipio_id === mid && c.fecha && c.fecha >= hoy()).sort((a, b) => a.fecha.localeCompare(b.fecha));

          ${campo({ n: `min_${v.id}`, l: 'Minutos antes', tipo: 'number', v: s.minutos, modo: 'numeric', ayuda: 'Entre 5 y 120 minutos.', extra: 'min="5" max="120" step="1"' })}

ACC['interruptor-form'] = (d, el) => {
  const f = el.closest('form'); const input = f.querySelector(`input[name="${d.campo}"]`);
  const on = !input.value; input.value = on ? '1' : '';
  el.classList.toggle('on', on); el.setAttribute('aria-checked', on);
  input.dispatchEvent(new Event('input', { bubbles: true }));
};
const reglaMinutos = (v, min = 5, max = 120) => {
  const t = String(v).trim();
  if (!t) return 'Escribe cuántos minutos antes.';
  if (!/^\d+$/.test(t)) return 'Escribe un número entero de minutos, sin decimales.';
  const n = Number(t);
  if (n < min || n > max) return `Tiene que ser entre ${min} y ${max} minutos.`;
};
ENVIOS.suscripciones = vals => {
  const u = yo(); const errores = {};
  Object.keys(vals).filter(k => k.startsWith('min_')).forEach(k => { const m = reglaMinutos(vals[k]); if (m) errores[k] = m; });
  if (Object.keys(errores).length) return errores;
  Object.keys(vals).filter(k => k.startsWith('on_')).forEach(k => {
    const vid = Number(k.slice(3));
    let s = db.suscripciones.find(x => x.vecino_id === u.id && x.vendedor_id === vid);
    if (!s) { s = { vecino_id: u.id, vendedor_id: vid, minutos: 15, activa: false }; db.suscripciones.push(s); }
    s.activa = !!vals[k]; s.minutos = Number(vals[`min_${vid}`]);
  });
  guardar(); toast('Avisos guardados.'); volver();
};
